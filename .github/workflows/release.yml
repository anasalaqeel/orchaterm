name: Release Executables

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # The pushed tag is the single source of truth for the release version:
      # stamp it into package.json / tauri.conf.json / Cargo.toml so builds,
      # artifacts, and the in-app version display all match the tag. Cuts a
      # release with just `git tag vX.Y.Z && git push origin vX.Y.Z`.
      - name: Derive app version from tag
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: node scripts/sync-version.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Publish Tauri Executables
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Orchaterm ${{ github.ref_name }}'
          releaseBody: 'Download the compiled Orchaterm desktop app binaries for Windows, macOS, or Linux below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
