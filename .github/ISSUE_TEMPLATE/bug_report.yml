name: Bug Report
description: Report an issue or bug you encountered in Orchaterm
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Orchaterm! Please fill out the form below to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Orchaterm Version
      description: What version of Orchaterm are you running? (e.g. 0.1.0)
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora/Other)
    validations:
      required: true
  - type: input
    id: llm_provider
    attributes:
      label: LLM Provider & Model
      description: Which LLM provider was active? (e.g. Ollama qwen2.5-coder, LM Studio, Claude 3.5 Sonnet, etc.)
      placeholder: Ollama qwen2.5-coder:7b
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Orchaterm
        2. Create a new terminal tab with agent 'claude'
        3. Trigger conductor goal ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Console Output / Screenshots
      description: Paste any error messages, terminal output, or drag & drop screenshots.
      render: shell
