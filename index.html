    <!--
      THESIS: Every terminal session reports itself like a weather station —
      one small glyph carrying every live variable, not a chat log or a
      patch-panel jack.
      OWN-WORLD: Near-black graphite chart room (#14171a), graphite-ink
      structure (#565d61), printed chart paper (#e9e6da), a warm-front red
      accent (#c0392b) for the primary/active state and a cold-front blue
      (#2f6fa8) reserved for relayed/incoming state. Rows are chart-paper
      cards divided by a single solid ink rule — never dashed perforated
      tape. Dependency edges are smooth isobar-style contour curves, never
      straight cable routing and never a jack-terminal circle. Status lives
      in a chip's own fill, never a floating glowing dot or a circular
      avatar.
      STORY: A developer reads their terminals like a meteorologist reads a
      synoptic chart — scanning many independent stations at once for state,
      trusting the chart's own markings over decoration.
      FIRST VIEWPORT: Terminal grid as a chart room, ink-ruled relay feed
      along the top, station sidebar left, board right.
      FORM: Meteorological Station Model — model-pick direction from the
      direction round, seed key 1c7a6526.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
